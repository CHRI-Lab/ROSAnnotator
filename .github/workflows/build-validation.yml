name: Build and Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/samw314/hri-sim-group6-frontend
  BACKEND_IMAGE: ghcr.io/samw314/hri-sim-group6-backend

jobs:
  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  backend-check:
    name: Check backend code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Python syntax
        run: python -m compileall -q src/backend

      - name: Ensure environment files are not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "Environment files containing secrets must not be committed."
            exit 1
          fi

  backend-image:
    name: Build backend application image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published GPU base image
        run: docker buildx imagetools inspect ghcr.io/kihara001/hri-sim-group6-backend-base:gpu-v1@sha256:5e41f697df35b67f74f48c1fab6974df0388bd1fc6c9102e5515220ef4c80261

      - name: Build backend application layer for pull request
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          build-args: BACKEND_BASE_IMAGE=python:3.9-slim
          push: false
          tags: backend-ci:${{ github.sha }}

      - name: Build and publish backend application image
        if: github.event_name == 'push'
        shell: bash
        env:
          BASE_IMAGE: ghcr.io/kihara001/hri-sim-group6-backend-base:gpu-v1@sha256:5e41f697df35b67f74f48c1fab6974df0388bd1fc6c9102e5515220ef4c80261
          TARGET_IMAGE: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
        run: |
          tar \
            --directory src/backend \
            --transform='s,^,app/,' \
            --create \
            --file backend-app.tar \
            manage.py ros_annotator rosbag_processing public

          docker run --rm \
            --volume "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            gcr.io/go-containerregistry/crane:debug \
            append \
            --platform linux/amd64 \
            --base "$BASE_IMAGE" \
            --new_layer backend-app.tar \
            --new_tag "$TARGET_IMAGE"

          docker run --rm \
            --volume "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            gcr.io/go-containerregistry/crane:debug \
            mutate \
            --platform linux/amd64 \
            "$TARGET_IMAGE" \
            --workdir /app \
            --cmd python \
            --cmd manage.py \
            --cmd runserver \
            --cmd 0.0.0.0:8000 \
            --tag "$TARGET_IMAGE"

  validation:
    name: All image builds successful
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend-check
      - backend-image

    steps:
      - name: Confirm successful validation
        run: echo "Frontend and backend validation succeeded."
