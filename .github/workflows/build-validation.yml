name: Build and Validation

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./src/frontend
            dockerfile: ./src/frontend/Dockerfile

          - component: backend
            context: ./src/backend
            dockerfile: ./src/backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: rosannotator-${{ matrix.component }}:${{ github.sha }}

          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  validation:
    name: Both Docker builds successful
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Confirm successful builds
        run: echo "Frontend and backend Docker images built successfully."