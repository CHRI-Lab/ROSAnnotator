name: Build and Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/samw314/hri-sim-group6-frontend
  BACKEND_IMAGE: ghcr.io/samw314/hri-sim-group6-backend

jobs:
  frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  backend-check:
    name: Check backend code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Python syntax
        run: python -m compileall -q src/backend

      - name: Ensure environment files are not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "Environment files containing secrets must not be committed."
            exit 1
          fi

  backend-image:
    name: Build backend application image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend application image
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          provenance: false

  validation:
    name: All image builds successful
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend-check
      - backend-image

    steps:
      - name: Confirm successful validation
        run: echo "Frontend and backend validation succeeded."
